[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "value-as-tool"
version = "0.1.0"
description = "Token-budgeted Aletheia-style evaluation for olympiad mathematics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "datasets>=3.5,<5",
  "dill>=0.4,<1",
  "httpx>=0.28,<1",
  "huggingface-hub>=0.36",
  "jinja2>=3.1,<4",
  "numpy>=2,<3",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6,<7",
  "regex>=2024.11",
  "transformers>=4.51,<6",
]

[project.optional-dependencies]
sglang = ["sglang[all]==0.5.19"]
vllm = ["vllm==0.29.0"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.11",
]

[project.scripts]
value-as-tool = "value_as_tool.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/value_as_tool"]

[tool.hatch.build.targets.wheel.force-include]
"prompts/qed_nano" = "value_as_tool/prompts/qed_nano"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
conflicts = [
  [
    { extra = "sglang" },
    { extra = "vllm" },
  ],
]
